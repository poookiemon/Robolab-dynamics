[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "robolab-gui"
version = "3.0.3"
description = "Automated Liquid Handling & Laboratory Automation Platform"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Bhagyashri", email = "shri@example.com" }
]
keywords = ["laboratory-automation", "liquid-handler", "biohit", "lims", "pyopensci"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pillow>=9.0.0",
]

[project.optional-dependencies]
analysis = [
    "pandas>=1.5.0",
    "seaborn>=0.12.0",
    "matplotlib>=3.6.0",
    "scipy>=1.9.0",
]
hardware = [
    "pythonnet>=3.0.0; sys_platform == 'win32'",
    "pyserial>=3.5",
]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]
qt = [
    "PyQt6>=6.4.0",
]
all = [
    "robolab-gui[analysis,hardware,test,qt]",
]

[project.scripts]
robolab = "robolab_gui.app:main"
robolab-gui = "robolab_gui.app:main"
biohit-gui = "robolab_gui.app:main"

[tool.setuptools]
package-dir = {"" = "src", "robolab_legacy" = "Biohit-Automated-Pipettor-GUI"}
packages = [
    "robolab_gui",
    "robolab_gui.ui",
    "robolab_gui.ui.qt",
    "robolab_gui.ui.tkinter",
    "robolab_gui.ui.tkinter.tabs",
    "robolab_gui.ui.tkinter.dialogs",
    "robolab_gui.ui.tkinter.widgets",
    "robolab_gui.reporting",
    "robolab_gui.configuration",
    "robolab_gui.hardware",
    "robolab_gui.analysis",
    "robolab_gui.integrations",
    "robolab_gui.execution",
    "robolab_gui.geometry",
    "robolab_gui.domain",
    "robolab_gui.domain.labware",
    "robolab_gui.protocols",
    "robolab_gui.protocols.builders",
    "robolab_gui.protocols.importers",
    "robolab_legacy",
]

[tool.setuptools.package-data]
robolab_gui = [
    "resources/machine_profiles/**/*.json",
    "resources/labware/**/*.json",
    "resources/protocols/**/*.json",
    "resources/default_workspaces/**/*.json",
    "resources/assets/**/*",
]
robolab_legacy = [
    "*.json",
    "labware/*.json",
    "protocols/**/*.json",
    "assets/*",
]
